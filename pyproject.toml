[project]
name = "volemoto"
version = "0.1.0"
description = ""
authors = [
    {name = "Mykola", email = "kolia.chaun@icloud.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "boto3 (>=1.42.85,<2.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "pillow (>=11.0.0,<12.0.0)",
    "pillow-heif (>=0.21.0,<1.0.0)",
    "fastapi-csrf-protect (>=1.0.7,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
isort = "^8.0.1"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

