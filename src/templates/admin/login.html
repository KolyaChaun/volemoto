<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Вхід — VOLE MOTO Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 12px; padding: 40px; width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,.08); border: 1px solid #e8e8e8; }
    .logo { font-size: 22px; font-weight: 800; color: #111; margin-bottom: 6px; }
    .logo span { color: #2d9e00; }
    .sub { font-size: 13px; color: #999; margin-bottom: 28px; }
    label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #888; margin-bottom: 6px; }
    input { width: 100%; padding: 11px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #2d9e00; }
    button { width: 100%; padding: 13px; background: #2d9e00; color: #fff; border: none; border-radius: 50px; font-size: 14px; font-weight: 700; cursor: pointer; }
    button:hover { background: #259000; }
    .error { background: #fff0f0; border: 1px solid #fcc; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #c00; margin-bottom: 16px; }
    .hint { margin-top: 16px; font-size: 11px; color: #bbb; text-align: center; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">VOLE <span>MOTO</span></div>
  <div class="sub">Панель адміністратора</div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post" action="/admin/login">
    <label>Логін</label>
    <input type="text" name="username" placeholder="admin" required autofocus>
    <label>Пароль</label>
    <input type="password" name="password" placeholder="••••••••" required>
    <button type="submit">Увійти</button>
  </form>
  <div class="hint">VOLE MOTO Admin Panel</div>
</div>
</body>
</html>
