<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Вхід — VOLE MOTO Admin</title>
  <link rel="stylesheet" href="/static/admin/css/login.css">
</head>
<body>
<div class="card">
  <div class="logo">VOLE <span>MOTO</span></div>
  <div class="sub">Панель адміністратора</div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post" action="/admin/login">
    <label>Логін</label>
    <input type="text" name="username" placeholder="admin" required autofocus>
    <label>Пароль</label>
    <input type="password" name="password" placeholder="••••••••" required>
    <button type="submit">Увійти</button>
  </form>
  <div class="hint">VOLE MOTO Admin Panel</div>
</div>
</body>
</html>
